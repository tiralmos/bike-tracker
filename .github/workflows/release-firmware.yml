name: Release Stock Firmware
permissions:
  contents: write
on:
  release:
    types: [created]

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v2
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install --user esphome==2026.9.1

      - name: Compile Release Firmware
        working-directory: firmware
        run: |
          esphome -s pixolletta_file_path "fonts/Pixolletta8px.ttf" -s project_version ${{ github.event.release.tag_name }} compile bike-tracker.yaml
          mkdir -p bin
          cp .esphome/build/bike-tracker/build/firmware.factory.bin bin/firmware.factory.bin
          cp .esphome/build/bike-tracker/build/firmware.ota.bin bin/firmware.ota.bin

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: "firmware/bin/*.bin"

      - name: Upload Release Binaries
        uses: skx/github-action-publish-binaries@release-1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "firmware/bin/*.bin"

  generate-manifest:
    name: Generate Release Manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Workflow Artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: /tmp/firmware-build

      # Devices check releases/latest/download/manifest.json for updates, and
      # the configurator's Docker image downloads the binaries from the same place.
      - name: Generate Manifest
        run: |
          mkdir -p /tmp/manifest
          cp firmware/manifest-template.json /tmp/manifest/manifest.json

          tag_name="${{ github.event.release.tag_name }}"
          sed -i "s@VERSION@${tag_name}@" /tmp/manifest/manifest.json

          base_download_url="https://github.com/${{ github.repository }}/releases/download/${tag_name}"

          sed -i "s@FACTORY_BIN_PATH@${base_download_url}/firmware.factory.bin@" /tmp/manifest/manifest.json

          ota_md5sum=$(md5sum /tmp/firmware-build/firmware.ota.bin | cut -d ' ' -f 1)
          sed -i "s@OTA_BIN_PATH@${base_download_url}/firmware.ota.bin@" /tmp/manifest/manifest.json
          sed -i "s@OTA_BIN_MD5@${ota_md5sum}@" /tmp/manifest/manifest.json

          sed -i "s@OTA_RELEASE_URL@${{ github.event.release.html_url }}@" /tmp/manifest/manifest.json

      - name: Upload Manifest
        uses: skx/github-action-publish-binaries@release-1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "/tmp/manifest/manifest.json"
